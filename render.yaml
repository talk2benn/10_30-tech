services:
  - type: web
    name: 1030-tech-storefront
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: 1030-tech-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: 1030-tech-db
    plan: basic-256mb
    databaseName: tech1030
    user: tech1030
